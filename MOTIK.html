<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a4a">
<title>Motik – le mot du jour</title>
<meta name="description" content="Trouve le mot du jour en 6 essais. Un nouveau mot chaque jour, gratuit, sans inscription.">
<style>
:root{--bg1:#0a1a4a;--bg2:#13318f;--cell:#2347b8;--cell-empty:#16297a;--red:#e0242b;--yellow:#f5c400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;overflow-x:hidden}
header{width:100%;max-width:500px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #ffffff22}
.title{text-align:center}
h1{font-size:1.5rem;letter-spacing:.25em;margin:0;font-weight:800;padding-left:.25em}
.sub{font-size:.72rem;opacity:.7;margin-top:2px}
.icon-btn{background:none;border:0;color:#fff;font-size:1.35rem;padding:6px 10px;cursor:pointer;width:48px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:100%;max-width:500px;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
#board{display:grid;gap:5px;width:min(100%,400px);margin:10px auto}
.row{display:grid;gap:5px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.2rem,6.5vw,2rem);text-transform:uppercase;background:var(--cell-empty);border:2px solid #ffffff22;border-radius:4px;position:relative;overflow:hidden;user-select:none}
.cell span{position:relative;z-index:1}
.cell.hint{color:#ffffff55}
.cell.filled{border-color:#ffffff88}
.cell.correct{background:var(--red);border-color:var(--red)}
.cell.absent{background:var(--cell);border-color:var(--cell)}
.cell.present{background:var(--cell);border-color:var(--cell);color:#1a1a1a}
.cell.present::before{content:"";position:absolute;inset:5%;border-radius:50%;background:var(--yellow)}
.cell.flip{animation:flip .5s ease}
.cell.pop{animation:pop .12s ease}
.row.shake{animation:shake .4s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#kb{width:100%;max-width:500px;display:flex;flex-direction:column;gap:6px;padding:0 2px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:54px;border:0;border-radius:6px;background:#3558c9;color:#fff;font-weight:700;font-size:1rem;text-transform:uppercase;cursor:pointer;padding:0;font-family:inherit}
.key.wide{flex:1.6;max-width:68px;font-size:.85rem}
.key.correct{background:var(--red)}
.key.present{background:var(--yellow);color:#111}
.key.absent{background:#0c1740;color:#ffffff66}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center;max-width:90vw}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#overlay.show{display:flex}
.modal{background:#0f2260;border:1px solid #ffffff33;border-radius:14px;padding:20px;width:100%;max-width:420px;max-height:90dvh;overflow:auto;position:relative}
.modal h2{margin:0 0 12px;font-size:1.2rem;text-align:center}
.modal p,.modal li{font-size:.95rem;line-height:1.45}
.modal ul{padding-left:18px;margin:8px 0}
.close{position:absolute;top:6px;right:10px;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px;margin:10px 0 16px}
.stats b{display:block;font-size:1.6rem}
.stats small{font-size:.7rem;opacity:.75}
.dist{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:.85rem}
.dist i{display:block;background:var(--cell);min-width:22px;padding:1px 6px;text-align:right;font-style:normal;font-weight:700;border-radius:3px}
.dist i.me{background:var(--red)}
.btn{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit}
.btn.alt{background:#3558c9}
.center{text-align:center}
.demo{display:flex;gap:4px;margin:6px 0}
.demo .cell{width:38px;font-size:1.2rem}
.next{text-align:center;margin-top:14px;font-size:.85rem;opacity:.85}
.next b{font-size:1.3rem;display:block;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="btn-help" aria-label="Règles">?</button>
  <div class="title"><h1>MOTIK</h1><div class="sub" id="sub"></div></div>
  <button class="icon-btn" id="btn-stats" aria-label="Statistiques">📊</button>
</header>
<main>
  <div id="board" aria-live="polite"></div>
  <div id="kb"></div>
</main>
<div id="toast"></div>
<div id="overlay"><div class="modal" id="modal"></div></div>

function todayIndex(){
  const p = parisParts();
  return Math.max(0, Math.round((Date.UTC(p.year,p.month-1,p.day)-START)/864e5));
}
function dailyWord(idx){
  const N = ANSWERS.length, cycle = Math.floor(idx/N), pos = idx % N;
  const rnd = mulberry32(0x9E3779B9 ^ (cycle*7919+1));
  const order = [...Array(N).keys()];
  for(let i=N-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  return ANSWERS[order[pos]];
}

/* ===== Dictionnaire de validation ===== */
const VALID = new Set(ANSWERS);
for(const n in DICT){ const s = DICT[n], k = +n; for(let i=0;i<s.length;i+=k) VALID.add(s.slice(i,i+k)); }

/* ===== Évaluation (gère les lettres en double) ===== */
function evaluate(guess, answer){
  const L = answer.length, res = Array(L).fill("absent"), rem = {};
  for(let i=0;i<L;i++){ if(guess[i]===answer[i]) res[i]="correct"; else rem[answer[i]]=(rem[answer[i]]||0)+1; }
  for(let i=0;i<L;i++){ if(res[i]==="correct") continue; if(rem[guess[i]]>0){res[i]="present";rem[guess[i]]--} }
  return res;
}

/* ===== Persistance ===== */
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({daily, stats})); }catch(e){} }
const saved = load();
let stats = saved.stats || {played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0],lastDay:-10};
const idx = todayIndex();
let daily = (saved.daily && saved.daily.idx===idx) ? saved.daily : {idx, guesses:[], status:"playing"};

/* ===== État de la partie ===== */
let mode = "daily";               // "daily" ou "practice"
let answer = dailyWord(idx);
let game = daily;                 // {guesses, status}
let cur = answer[0];              // saisie en cours (1re lettre offerte)
let busy = false;

function startPractice(){
  mode = "practice";
  answer = ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
  game = {guesses:[], status:"playing"};
  cur = answer[0]; busy = false;
  closeModal(); buildBoard(); renderAll();
}
function backToDaily(){
  mode = "daily"; answer = dailyWord(idx); game = daily;
  cur = answer[0]; busy = false;
  closeModal(); buildBoard(); renderAll();
}

/* ===== Plateau ===== */
const boardEl = document.getElementById("board");
const L = () => answer.length;
function buildBoard(){
  boardEl.innerHTML = "";
  boardEl.style.gridTemplateRows = `repeat(${MAX_TRIES},auto)`;
  for(let r=0;r<MAX_TRIES;r++){
    const row = document.createElement("div"); row.className="row";
    row.style.gridTemplateColumns = `repeat(${L()},1fr)`;
    for(let c=0;c<L();c++){ const d=document.createElement("div"); d.className="cell"; d.innerHTML="<span></span>"; row.appendChild(d); }
    boardEl.appendChild(row);
  }
}
function knownCorrect(){
  const k = Array(L()).fill("");
  game.guesses.forEach(g=>evaluate(g,answer).forEach((s,i)=>{ if(s==="correct") k[i]=g[i]; }));
  k[0] = answer[0]; return k;
}
function renderRow(r){
  const row = boardEl.children[r], cells = row.children;
  if(r < game.guesses.length){
    const g = game.guesses[r], ev = evaluate(g, answer);
    for(let c=0;c<L();c++){ cells[c].className="cell "+ev[c]; cells[c].firstChild.textContent=g[c]; }
  } else if(r===game.guesses.length && game.status==="playing"){
    const k = knownCorrect();
    for(let c=0;c<L();c++){
      const ch = cur[c];
      if(ch){ cells[c].className="cell filled"; cells[c].firstChild.textContent=ch; }
      else if(k[c]){ cells[c].className="cell hint"; cells[c].firstChild.textContent=k[c]; }
      else { cells[c].className="cell"; cells[c].firstChild.textContent=""; }
    }
  } else {
    for(let c=0;c<L();c++){ cells[c].className="cell"; cells[c].firstChild.textContent=""; }
  }
}
function renderAll(){ for(let r=0;r<MAX_TRIES;r++) renderRow(r); renderKeyboard(); renderSub(); }
function renderSub(){
  document.getElementById("sub").textContent = mode==="daily" ? `Mot n°${idx+1} · ${L()} lettres` : `Entraînement · ${L()} lettres`;
}

/* ===== Clavier ===== */
const kbEl = document.getElementById("kb");
const ROWS = ["azertyuiop","qsdfghjklm","*wxcvbn#"];
function buildKeyboard(){
  ROWS.forEach(r=>{
    const row=document.createElement("div"); row.className="krow";
    [...r].forEach(ch=>{
      const b=document.createElement("button"); b.className="key";
      if(ch==="*"){b.textContent="Entrée";b.classList.add("wide");b.dataset.k="Enter"}
      else if(ch==="#"){b.textContent="⌫";b.classList.add("wide");b.dataset.k="Backspace"}
      else {b.textContent=ch;b.dataset.k=ch}
      row.appendChild(b);
    });
    kbEl.appendChild(row);
  });
}
kbEl.addEventListener("click",e=>{ const b=e.target.closest(".key"); if(b) press(b.dataset.k); });
function renderKeyboard(){
  const best = {}, rank = {absent:1,present:2,correct:3};
  game.guesses.forEach(g=>evaluate(g,answer).forEach((s,i)=>{ if(!best[g[i]]||rank[s]>rank[best[g[i]]]) best[g[i]]=s; }));
  kbEl.querySelectorAll(".key").forEach(b=>{
    const k=b.dataset.k; b.classList.remove("correct","present","absent");
    if(best[k]) b.classList.add(best[k]);
  });
}

/* ===== Saisie ===== */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="Escape"){closeModal();return}
  if(overlay.classList.contains("show")) return;
  if(e.key==="Enter"||e.key==="Backspace") press(e.key);
  else if(/^[a-zA-ZÀ-ÿ]$/.test(e.key)) press(e.key.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase());
});
function press(k){
  if(busy||game.status!=="playing") return;
  if(k==="Enter") return submit();
  if(k==="Backspace"){ if(cur.length>1){cur=cur.slice(0,-1);renderRow(game.guesses.length)} return; }
  if(/^[a-z]$/.test(k) && cur.length<L()){
    cur+=k; renderRow(game.guesses.length);
    const cell = boardEl.children[game.guesses.length].children[cur.length-1];
    cell.classList.add("pop");
  }
}
function toast(msg,ms=1400){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),ms);
}
function submit(){
  const r = game.guesses.length, row = boardEl.children[r];
  if(cur.length<L()){ row.classList.add("shake"); setTimeout(()=>row.classList.remove("shake"),400); return toast("Pas assez de lettres"); }
  if(!VALID.has(cur)){ row.classList.add("shake"); setTimeout(()=>row.classList.remove("shake"),400); return toast("Mot inconnu"); }
  const g = cur, ev = evaluate(g, answer);
  busy = true;
  // Révélation case par case
  for(let c=0;c<L();c++){
    const cell=row.children[c];
    setTimeout(()=>{ cell.classList.add("flip"); setTimeout(()=>{ cell.className="cell flip "+ev[c]; cell.firstChild.textContent=g[c]; },250); }, c*220);
  }
  setTimeout(()=>{
    game.guesses.push(g); cur = answer[0];
    const won = g===answer;
    if(won) game.status="won"; else if(game.guesses.length>=MAX_TRIES) game.status="lost";
    if(game.status!=="playing" && mode==="daily") recordResult();
    if(mode==="daily") save();
    busy=false; renderAll();
    if(game.status==="won") toast(["Génial !","Magnifique !","Superbe !","Bien joué !","Ouf !","De justesse !"][game.guesses.length-1],1800);
    if(game.status==="lost") toast(answer.toUpperCase(),3000);
    if(game.status!=="playing") setTimeout(showStats,1800);
  }, L()*220+400);
}
function recordResult(){
  const won = game.status==="won";
  stats.played++;
  if(won){ stats.wins++; stats.streak = (stats.lastDay===idx-1 && stats.streak>0) ? stats.streak+1 : 1; stats.max=Math.max(stats.max,stats.streak); stats.dist[game.guesses.length-1]++; }
  else stats.streak=0;
  stats.lastDay=idx;
}

/* ===== Fenêtres ===== */
const overlay=document.getElementById("overlay"), modal=document.getElementById("modal");
function openModal(html){ modal.innerHTML='<button class="close" aria-label="Fermer">×</button>'+html; overlay.classList.add("show"); modal.querySelector(".close").onclick=closeModal; }
function closeModal(){ overlay.classList.remove("show"); clearInterval(showStats.timer); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });

function showHelp(){
  openModal(`<h2>Comment jouer</h2>
  <p>Trouve le mot du jour en ${MAX_TRIES} essais. La première lettre est donnée.</p>
  <ul><li>Chaque essai doit être un mot valide de la bonne longueur.</li>
  <li>Après chaque essai, les cases changent de couleur.</li></ul>
  <div class="demo"><div class="cell correct"><span>M</span></div><div class="cell"><span>O</span></div><div class="cell"><span>T</span></div></div>
  <p><b>Rouge</b> : bonne lettre, bonne place.</p>
  <div class="demo"><div class="cell"><span>M</span></div><div class="cell present"><span>O</span></div><div class="cell"><span>T</span></div></div>
  <p><b>Cercle jaune</b> : la lettre est dans le mot, mais ailleurs.</p>
  <div class="demo"><div class="cell"><span>M</span></div><div class="cell"><span>O</span></div><div class="cell absent"><span>T</span></div></div>
  <p><b>Bleu</b> : la lettre n'est pas dans le mot.</p>
  <p class="center"><b>Un nouveau mot chaque jour à minuit (heure de Paris).</b></p>`);
}
function nextIn(){
  const p=parisParts(); let s=86400-(p.hour*3600+p.minute*60+p.second);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return [h,m,x].map(v=>String(v).padStart(2,"0")).join(":");
}
function shareText(){
  const map={correct:"🟥",present:"🟡",absent:"🟦"};
  const head=`Motik #${idx+1} ${game.status==="won"?game.guesses.length:"X"}/${MAX_TRIES}`;
  return head+"\n"+game.guesses.map(g=>evaluate(g,answer).map(s=>map[s]).join("")).join("\n")+"\n"+location.href.split("#")[0];
}
function showStats(){
  const finished = game.status!=="playing";
  const pct = stats.played ? Math.round(stats.wins/stats.played*100) : 0;
  const mx = Math.max(1,...stats.dist);
  const dist = stats.dist.map((n,i)=>`<div class="dist"><span>${i+1}</span><i class="${mode==="daily"&&finished&&game.status==="won"&&game.guesses.length===i+1?"me":""}" style="width:${Math.max(8,n/mx*100)}%">${n}</i></div>`).join("");
  let html=`<h2>Statistiques</h2>
  <div class="stats"><div><b>${stats.played}</b><small>Parties</small></div><div><b>${pct}</b><small>% victoires</small></div><div><b>${stats.streak}</b><small>Série</small></div><div><b>${stats.max}</b><small>Meilleure série</small></div></div>${dist}`;
  if(mode==="daily" && finished){
    html+=`<div class="next">Prochain mot dans<b id="cd">${nextIn()}</b></div><button class="btn" id="share">Partager mon résultat</button>`;
  }
  if(mode==="daily" && game.status==="lost") html+=`<p class="center">Le mot était <b>${answer.toUpperCase()}</b></p>`;
  html+= mode==="daily" ? `<button class="btn alt" id="practice">Rejouer avec un mot au hasard</button>` : `<button class="btn alt" id="daily">Retour au mot du jour</button>`;
  openModal(html);
  const cd=document.getElementById("cd");
  if(cd){ showStats.timer=setInterval(()=>{ cd.textContent=nextIn(); if(cd.textContent==="00:00:00") location.reload(); },1000); }
  const sh=document.getElementById("share");
  if(sh) sh.onclick=async()=>{ const t=shareText(); try{ if(navigator.share){await navigator.share({text:t});} else {await navigator.clipboard.writeText(t); toast("Résultat copié !");} }catch(e){ try{await navigator.clipboard.writeText(t);toast("Résultat copié !")}catch(_){} } };
  const pr=document.getElementById("practice"); if(pr) pr.onclick=startPractice;
  const dl=document.getElementById("daily"); if(dl) dl.onclick=backToDaily;
}
document.getElementById("btn-help").onclick=showHelp;
document.getElementById("btn-stats").onclick=showStats;

/* Si la page reste ouverte après minuit : on recharge pour le nouveau mot */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && mode==="daily" && todayIndex()!==idx) location.reload(); });

/* ===== Démarrage ===== */
buildKeyboard(); buildBoard(); renderAll();
if(!saved.daily && !saved.stats) showHelp();
else if(game.status!=="playing") setTimeout(showStats,300);
</script>
</body>
</html>
